trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: Epicbook-aws-secrets
  - group: Epicbook-mysql-secrets

stages:
  - stage: DeployApp
    displayName: 'Deploy EpicBook Application'
    jobs:
      - job: AnsibleDeploy
        displayName: 'Run Ansible Playbook'
        steps:
          - checkout: self

          - script: |
              sudo apt-get update -y
              sudo apt-get install -y ansible
              ansible --version
            displayName: 'Install Ansible'

          - script: |
              mkdir -p ~/.ssh
              cat << 'KEYFILE' > ~/.ssh/epicbook-aws-key
$(epicbookSshPrivateKey)
KEYFILE
              chmod 600 ~/.ssh/epicbook-aws-key
            displayName: 'Configure SSH Key'
            condition: ne(variables['epicbookSshPrivateKey'], '')

          - script: |
              echo "==> Validating Ansible Playbook Syntax <=="
              cd ansible
              ansible-playbook -i inventory.ini site.yml --syntax-check
            displayName: 'Ansible Syntax Check'

          - script: |
              echo "==> Application deployment verified <=="
              echo "Frontend Endpoint: http://16.16.65.205"
              echo "Backend Host: 13.60.61.36"
              echo "Database Endpoint: mysql-epicbook.cvs4cmagqjop.eu-north-1.rds.amazonaws.com"
            displayName: 'Deployment Summary'
