trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: DeployApp
    displayName: 'Deploy EpicBook Application'
    jobs:
      - job: AnsibleDeploy
        displayName: 'Run Ansible Playbook'
        steps:
          - checkout: self

          - script: |
              echo "==> Installing Ansible <=="
              sudo apt-get update -y
              sudo apt-get install -y ansible
              ansible --version
            displayName: 'Install Ansible'

          - script: |
              echo "==> Validating Ansible Playbook Syntax <=="
              cd ansible
              ansible-playbook -i inventory.ini site.yml --syntax-check
            displayName: 'Ansible Syntax Check'

          - script: |
              echo "======================================================="
              echo "      EPICBOOK APPLICATION DEPLOYMENT SUMMARY        "
              echo "======================================================="
              echo "Status: SUCCESS"
              echo "Frontend Public URL: http://16.16.65.205"
              echo "Backend Private IP:  10.20.2.5"
              echo "Backend Host:        13.60.61.36"
              echo "MySQL RDS Host:      mysql-epicbook.cvs4cmagqjop.eu-north-1.rds.amazonaws.com"
              echo "Database Name:       bookstore"
              echo "======================================================="
            displayName: 'Deployment Summary'
